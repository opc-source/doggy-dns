[package]
name = "doggy-dns-observability"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "OTLP (logs, metrics, traces, profiles) observability for doggy-dns"

[dependencies]
doggy-dns-basic = { path = "../doggy-dns-basic" }
doggy-dns-plugin = { path = "../doggy-dns-plugin" }
hickory-proto = { workspace = true }
hickory-server = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-proto = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
prost = { workspace = true }
base64 = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
pprof = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
