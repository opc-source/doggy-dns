[server]
listen_addr = "0.0.0.0"
port = 15353
tcp_timeout = 10
shutdown_timeout = 5
worker_threads = 1    # defaults to 1 (runs as DaemonSet, one per node)
#rotate_answers = true # cycle multi-record answers so clients spread across
#                      # instances; false keeps the authority's own order

#[server.tls]
#enabled = false
#port = 853
#cert_path = "/path/to/cert.pem"
#key_path = "/path/to/key.pem"

#[server.https]
#enabled = false
#port = 443
#cert_path = "/path/to/cert.pem"
#key_path = "/path/to/key.pem"

[middleware]
logging = true

# OTLP observability. Disabled by default.
# OpenObserve is the default backend; OTel Collector and Vector work by
# changing `endpoint` (both use http://host:4318 + /v1/<signal>).
[observability]
enabled = true
backend = "openobserve"              # openobserve | otel-collector | vector | custom
endpoint = "http://127.0.0.1:5080/api/default"
# protocol = "http/protobuf"
service_name = "doggy-dns"
environment = "prod"
timeout_secs = 10
headers = { "stream-name" = "doggy-dns" }
basic_auth = { username = "root@example.com", password = "${OPENOBSERVE_PASSWORD}" }
# resource_attributes = { "service.namespace" = "dns" }

[observability.logs]
enabled = true
level = "info"                       # OTLP log level; stdout uses RUST_LOG
stdout = true

[observability.metrics]
enabled = true
interval_secs = 15

[observability.traces]
enabled = true
sample_ratio = 1.00
max_queue_size = 8192
max_export_batch_size = 512
scheduled_delay_ms = 2000

[observability.profiles]
enabled = false                       # CPU profiles only; Linux/macOS
interval_secs = 60
duration_secs = 10
frequency_hz = 99

[[plugins]]
kind = "nacos"
enabled = false
server_addr = "127.0.0.1:8848"
namespace = "public"
group = "DEFAULT_GROUP"
dns_zone = "nacos.local"
ttl = 6

[[plugins]]
kind = "native"
enabled = true
cache_size = 4096
min_ttl = 10
max_ttl = 300

[[plugins]]
kind = "forward"
enabled = true
upstream = ["8.8.8.8:53", "1.1.1.1:53"]
cache_size = 1024
min_ttl = 30
max_ttl = 600

[remote_config]
enabled = false
server_addr = "127.0.0.1:8848"
namespace = "public"
group = "DOGGY_DNS"
data_id = "doggy-dns.toml"

# XDP fast path (optional, requires --features xdp build)
# [xdp]
# enabled = false
# interface = ""              # Empty = auto-detect default route interface
# cache_size = 65536          # BPF LRU hash map max entries
# negative_ttl = 30           # NXDomain cache TTL in seconds
# attach_mode = "auto"        # "auto" or "manual"
# pin_path = "/sys/fs/bpf/doggy-dns/dns_cache"
#                             # bpffs file is <pin_path>_v1; a restart reuses
#                             # that map, so no '.' in the path

# Node-side service control plane. Disabled by default.
# One HTTP listener; `endpoints` chooses what it exposes:
#   "mcp"     JSON-RPC over Streamable HTTP at /mcp (Bearer token guarded)
#   "healthz" liveness probe, always 200, no auth
#   "readyz"  readiness + live runtime signals report, always 200, no auth
# [control]
# enabled = false
# listen_addr = "127.0.0.1"
# port = 19090
# token = "change-me"          # Bearer token; guards /mcp only; omit for no auth
# allowed_hosts = ["dns-node-1", "10.0.0.5:19090"]
# endpoints = ["mcp", "healthz", "readyz"]
