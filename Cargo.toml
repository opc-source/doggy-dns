[workspace]
resolver = "2"
members = [
    "crates/doggy-dns-basic",
    "crates/doggy-dns-core",
    "crates/doggy-dns-plugin",
    "crates/doggy-dns-nacos",
    "crates/doggy-dns-observability",
    "crates/doggy-dns-xdp",
    "crates/doggy-dns-control",
]

[package]
name = "doggy-dns"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A Rust-based service discovery DNS server built on hickory-dns"

[features]
xdp = ["dep:doggy-dns-xdp"]
default = []

[dependencies]
doggy-dns-core = { path = "crates/doggy-dns-core" }
doggy-dns-plugin = { path = "crates/doggy-dns-plugin" }
doggy-dns-nacos = { path = "crates/doggy-dns-nacos" }
doggy-dns-observability = { path = "crates/doggy-dns-observability" }
doggy-dns-xdp = { path = "crates/doggy-dns-xdp", optional = true }
doggy-dns-control = { path = "crates/doggy-dns-control" }
hickory-server = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
dashmap = { workspace = true }
hickory-proto = { workspace = true }

[workspace.dependencies]
hickory-server = { version = "0.26", features = ["tls-ring", "https-ring", "resolver"] }
hickory-proto = "0.26"
hickory-resolver = { version = "0.26", features = ["tokio", "system-config"] }
nacos-sdk = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
dashmap = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
async-trait = "0.1"
rustls = "0.23"
rustls-pemfile = "2"
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }

# Observability (OTLP -> OpenObserve / OTel Collector / Vector)
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs", "internal-logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs", "internal-logs"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics", "logs", "internal-logs"] }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "profiles", "trace", "logs", "metrics"] }
opentelemetry-appender-tracing = "0.33"
tracing-opentelemetry = "0.34"
pprof = "0.15"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
prost = "0.14"
base64 = "0.23"

# XDP / eBPF
aya = "0.14"

# MCP server
rmcp = { version = "3.7", features = ["server", "transport-streamable-http-server"] }
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde_json = "1"
thiserror = "2"
