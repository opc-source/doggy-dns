name: PR comment
description: >-
  Post the exact contents of a file as a comment on the pull request that
  triggered the run, through issues.createComment. The caller keeps its `if:`
  guard (same-repo pull_request only): a push to main has no PR to comment on
  and a fork PR's token is read-only. The caller assembles the body file, so
  the posted markdown is unchanged.
inputs:
  body-file:
    description: File whose exact contents become the comment body.
    required: true
runs:
  using: composite
  steps:
    - name: Create comment
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync('${{ inputs.body-file }}', 'utf8');
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body,
          });
