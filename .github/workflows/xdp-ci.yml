name: XDP CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'crates/doggy-dns-xdp/**'
      - 'xdp/**'
      - 'crates/doggy-dns-plugin/**'
      - 'crates/doggy-dns-core/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'crates/doggy-dns-xdp/**'
      - 'xdp/**'
      - 'crates/doggy-dns-plugin/**'
      - 'crates/doggy-dns-core/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  xdp-fmt:
    name: XDP Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      # xdp/ is a separate workspace pinned to nightly by its rust-toolchain.toml,
      # so the root `cargo fmt --all` never sees it.
      - name: cargo fmt (xdp)
        run: cd xdp && cargo fmt --all -- --check

  xdp-integration-test:
    name: XDP Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install bpf-linker
        run: |
          curl -sSL https://github.com/aya-rs/bpf-linker/releases/download/v0.12.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst | tar -xI zstd -C ~/.cargo/bin/
      - name: Build eBPF program
        run: cd xdp && cargo build -Z build-std=core,alloc --release --target bpfel-unknown-none
      - name: Run XDP integration tests
        run: sudo env "PATH=$PATH" cargo test -p doggy-dns-xdp --test xdp_integration_test -- --ignored --nocapture
        env:
          RUST_LOG: debug
      - name: Cleanup
        if: always()
        run: sudo ip netns delete doggy-dns-test || true

  xdp-component-bench:
    name: XDP Component Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install bpf-linker
        run: |
          curl -sSL https://github.com/aya-rs/bpf-linker/releases/download/v0.12.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst | tar -xI zstd -C ~/.cargo/bin/
      - name: Build eBPF program
        run: cd xdp && cargo build -Z build-std=core,alloc --release --target bpfel-unknown-none
      # Benchmarks run as root (sudo env "PATH=$PATH"; plain `sudo -E` is
      # silently ignored by the runner's sudo version).
      #
      # Comparison design: base first, PR second. The base run is a plain
      # --save-baseline, which fully overwrites target/criterion/<id>/base/
      # with fresh sample files in THIS worktree — so the PR comparison never
      # reads stale/partial baseline artifacts from the restored cache. The
      # PR run then uses --baseline base (strict: fails loudly if the base run
      # above did not succeed) and criterion prints per-benchmark "change:"
      # lines measuring the PR against main in the same job.
      #
      # Each side rebuilds the eBPF object from its own checkout, so main and
      # PR are measured against their own kernel code, not a shared build.
      # workflow_dispatch takes the main branch (single run, no comparison).
      - name: Run benchmarks (base)
        if: github.event_name == 'pull_request'
        run: |
          git checkout origin/main
          (cd xdp && cargo build -Z build-std=core,alloc --release --target bpfel-unknown-none)
          sudo env "PATH=$PATH" cargo bench -p doggy-dns-xdp --bench xdp_component_bench -- --save-baseline base | tee /tmp/bench-base.txt
      - name: Checkout PR head
        if: github.event_name == 'pull_request'
        run: git checkout "$HEAD_SHA"
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Build eBPF program (PR)
        if: github.event_name == 'pull_request'
        run: cd xdp && cargo build -Z build-std=core,alloc --release --target bpfel-unknown-none
      - name: Run benchmarks (PR)
        if: github.event_name == 'pull_request'
        run: |
          sudo env "PATH=$PATH" cargo bench -p doggy-dns-xdp --bench xdp_component_bench -- --baseline base | tee /tmp/bench-pr.txt
      # A push to main has no PR to compare against; just keep a fresh
      # baseline (and its logs) on record.
      - name: Run benchmarks (main)
        if: github.event_name != 'pull_request'
        run: |
          sudo env "PATH=$PATH" cargo bench -p doggy-dns-xdp --bench xdp_component_bench -- --save-baseline base | tee /tmp/bench-main.txt
      - name: Write job summary
        if: always()
        run: |
          {
            echo "## XDP Component Benchmark Comparison"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo '### Base (main)'
              echo '```'
              cat /tmp/bench-base.txt 2>/dev/null || echo "benchmarks did not run"
              echo '```'
              echo '### PR (change lines compare against base)'
              echo '```'
              cat /tmp/bench-pr.txt 2>/dev/null || echo "benchmarks did not run"
              echo '```'
            else
              echo '### Main'
              echo '```'
              cat /tmp/bench-main.txt 2>/dev/null || echo "benchmarks did not run"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # A push to main has no issue/PR to comment on, and fork PRs get a
      # read-only token, so only same-repo PRs can be commented on.
      - name: Post comparison comment
        if: |
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pr = fs.readFileSync('/tmp/bench-pr.txt', 'utf8');
            const base = fs.readFileSync('/tmp/bench-base.txt', 'utf8');
            const body = `## XDP Component Benchmark Comparison\n\n### Base (main)\n\`\`\`\n${base}\n\`\`\`\n\n### PR (change lines compare against base)\n\`\`\`\n${pr}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  xdp-stress-test:
    name: XDP Stress Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          curl -sSL https://github.com/aya-rs/bpf-linker/releases/download/v0.12.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst | tar -xI zstd -C ~/.cargo/bin/
          sudo apt-get update && sudo apt-get install -y dnsperf
      - name: Build eBPF program
        run: cd xdp && cargo build -Z build-std=core,alloc --release --target bpfel-unknown-none
      - name: Build doggy-dns (with XDP)
        run: cargo build --features xdp --release
      - name: Generate query file
        run: |
          for i in $(seq 1 1000); do
            echo "svc-${i}.nacos.default.doggy.test A"
          done > /tmp/queries.txt
      - name: Stress test (userspace-only)
        run: |
          ./target/release/doggy-dns config/doggy-dns-stress.toml &
          echo $! > /tmp/server.pid
          sleep 2
          dnsperf -s 127.0.0.1 -p 5353 -d /tmp/queries.txt -n 1 -l 5 > /dev/null 2>&1 || true
          dnsperf -s 127.0.0.1 -p 5353 -d /tmp/queries.txt -n 10 -T 4 -l 30 > /tmp/userspace-result.txt 2>&1 || true
          kill $(cat /tmp/server.pid)
      - name: Stress test (XDP)
        continue-on-error: true
        run: |
          sudo ./target/release/doggy-dns config/doggy-dns-stress-xdp.toml &
          echo $! | sudo tee /tmp/server.pid
          sleep 2
          sudo dnsperf -s 127.0.0.1 -p 5353 -d /tmp/queries.txt -n 1 -l 5 > /dev/null 2>&1 || true
          sudo dnsperf -s 127.0.0.1 -p 5353 -d /tmp/queries.txt -n 10 -T 4 -l 30 > /tmp/xdp-result.txt 2>&1 || true
          sudo kill $(cat /tmp/server.pid) || true
        env:
          XDP_INTERFACE: lo
      - name: Generate comparison report
        run: python3 scripts/xdp_stress_report.py /tmp/userspace-result.txt /tmp/xdp-result.txt > /tmp/stress-report.md || echo "Stress report generation skipped (dnsperf failed)" > /tmp/stress-report.md
      - name: Write job summary
        if: always()
        run: |
          if [ -f /tmp/stress-report.md ]; then
            cat /tmp/stress-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      # A push to main has no issue/PR to comment on, and fork PRs get a
      # read-only token, so only same-repo PRs can be commented on.
      - name: Post PR comment
        if: |
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/stress-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
