name: Nacos CI

# Live-Nacos end-to-end coverage: tests/nacos_e2e_test.rs starts a real
# doggy-dns process against a standalone Nacos server and resolves services
# through the subscription cache. Five cases additionally publish a whole
# configuration and wait for the running resolver to serve it; they are slow on
# purpose, because nacos-sdk notices config changes on a ~60 s poll. One of the
# five also reads back the `*.online.toml` record the applied push leaves beside
# the case config, and checks that a stray `kill -HUP` changes nothing. The
# cases are #[ignore]d, so plain `cargo test --workspace` never needs a server.
# One further case needs no server on purpose: it boots the resolver against an
# address nothing answers on, which is what the SDK's emergency start is for —
# the chain still builds, the zone still answers, and the trigger subscribes once.
#
# Image choice: Nacos 2.x, the protocol line nacos-sdk 0.8 speaks (v1/v2 HTTP
# plus the 9848 gRPC channel). The `latest` tag now points at Nacos 3.x, which
# enables authentication by default and moved to /nacos/v3 endpoints, so the
# tag is pinned deliberately — bump it together with the SDK, not casually.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/nacos_e2e_test.rs'
      - 'config/**'
      - 'crates/doggy-dns-nacos/**'
      - 'crates/doggy-dns-plugin/**'
      - 'crates/doggy-dns-basic/**'
      - 'crates/doggy-dns-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/nacos-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/nacos_e2e_test.rs'
      - 'config/**'
      - 'crates/doggy-dns-nacos/**'
      - 'crates/doggy-dns-plugin/**'
      - 'crates/doggy-dns-basic/**'
      - 'crates/doggy-dns-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/nacos-ci.yml'

env:
  CARGO_TERM_COLOR: always
  NACOS_IMAGE: nacos/nacos-server:v2.5.4

jobs:
  nacos-e2e:
    name: Nacos End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start Nacos (standalone, embedded Derby)
        run: |
          docker run -d --name nacos \
            -e MODE=standalone \
            -e NACOS_AUTH_ENABLE=false \
            -e JVM_XMS=512m \
            -e JVM_XMX=512m \
            -p 8848:8848 \
            -p 9848:9848 \
            "$NACOS_IMAGE"
      # The image declares no HEALTHCHECK, and readiness is what separates a
      # slow start from a real failure, so poll the console health endpoint.
      - name: Wait for Nacos readiness
        run: |
          for attempt in $(seq 1 40); do
            if curl -fsS -m 3 http://127.0.0.1:8848/nacos/v1/console/health/readiness >/dev/null; then
              echo "Nacos ready after $attempt attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Nacos did not become ready within 120s"
          docker logs --tail 200 nacos || true
          exit 1
      - name: Run Nacos e2e tests
        run: cargo test --test nacos_e2e_test -- --ignored --nocapture
        env:
          DOGGY_NACOS_ADDR: 127.0.0.1:8848
          RUST_LOG: info
      - name: Dump Nacos logs on failure
        if: failure()
        run: docker logs --tail 200 nacos || true
      - name: Stop Nacos
        if: always()
        run: docker rm -f nacos || true
