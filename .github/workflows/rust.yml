name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --workspace --verbose

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile benchmarks
        run: cargo bench --no-run --workspace

  performance:
    name: Performance
    runs-on: ubuntu-latest
    # Two LTO builds plus six criterion runs on two vCPUs; without a bound a
    # stuck build would hold the concurrency slot until the default timeout.
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The stress report script is this job's renderer, so its suite runs here
      # rather than in the lint job: a broken --single mode fails this job loudly
      # before the report step can silently emit nothing.
      - name: Report script tests
        run: python3 scripts/test_xdp_stress_report.py -v
      - name: Install dnsperf
        uses: ./.github/actions/dnsperf-run
        with:
          install: true
          run: false
      - name: Generate query file
        run: |
          for i in $(seq 1 1000); do
            echo "svc-${i}.nacos.default.doggy.test A"
          done > /tmp/queries.txt
      # Component benches first: they need their own release builds, and the
      # base-vs-PR dance below checks main out from under the worktree.
      # Comparison design mirrors xdp-ci.yml: base is saved, PR compares
      # against it in the same job on the same runner, so the delta is not
      # a cross-runner artefact.
      - name: Component benchmarks (base)
        if: github.event_name == 'pull_request'
        run: |
          git checkout origin/main
          rm -rf target/criterion
          cargo bench -p doggy-dns-core --bench handler_bench -- --save-baseline base | tee /tmp/bench-base.txt
          cargo bench -p doggy-dns-plugin --bench chain_bench -- --save-baseline base | tee -a /tmp/bench-base.txt
          cargo bench -p doggy-dns-nacos --bench nacos_bench -- --save-baseline base | tee -a /tmp/bench-base.txt
      - name: Checkout PR head
        if: github.event_name == 'pull_request'
        run: git checkout "$HEAD_SHA"
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # Lenient on purpose: a bench ID that is new or renamed on the PR side has
      # no data under `base`, and plain `--baseline base` panics when one is
      # missing. Lenient runs it uncompared instead, which is what a report-only
      # job wants.
      - name: Component benchmarks (PR)
        if: github.event_name == 'pull_request'
        run: |
          cargo bench -p doggy-dns-core --bench handler_bench -- --baseline-lenient base | tee /tmp/bench-pr.txt
          cargo bench -p doggy-dns-plugin --bench chain_bench -- --baseline-lenient base | tee -a /tmp/bench-pr.txt
          cargo bench -p doggy-dns-nacos --bench nacos_bench -- --baseline-lenient base | tee -a /tmp/bench-pr.txt
      # A push to main has no PR to compare against; keep a fresh baseline.
      - name: Component benchmarks (main)
        if: github.event_name != 'pull_request'
        run: |
          rm -rf target/criterion
          cargo bench -p doggy-dns-core --bench handler_bench -- --save-baseline base | tee /tmp/bench-main.txt
          cargo bench -p doggy-dns-plugin --bench chain_bench -- --save-baseline base | tee -a /tmp/bench-main.txt
          cargo bench -p doggy-dns-nacos --bench nacos_bench -- --save-baseline base | tee -a /tmp/bench-main.txt
      # End-to-end: the pure userspace path (no XDP), forward plugin, so this
      # measures the transport that dominates the budget. RUST_LOG=warn keeps
      # the per-query info log out of the measurement; without it the job
      # measures the runner's log pipe. The nacos scenario is deliberately
      # absent: the server aborts boot when Nacos is unreachable, so a live
      # Nacos would be a job dependency rather than a config file.
      # The server outlives its step now that the dnsperf passes are a separate
      # composite-action step, so its output goes to a file: a background child
      # holding the step's stdout pipe would keep the step from finishing.
      - name: Build and start server (userspace path)
        run: |
          cargo build --release
          RUST_LOG=warn ./target/release/doggy-dns config/doggy-dns-stress.toml > /tmp/e2e-server.log 2>&1 &
          echo $! > /tmp/server.pid
          sleep 2
      # `-n 100000` rather than `-n 10` so the `-l 30` wall-clock limit is
      # what ends the run: 10 cycles of a 1000-name file finish in a quarter
      # of a second on this transport (~40k QPS), which measured a startup
      # burst instead of steady state. Same window as the XDP stress job, so
      # the two reports are comparable.
      - name: Run dnsperf (end-to-end)
        uses: ./.github/actions/dnsperf-run
        with:
          install: false
          output: /tmp/e2e-result.txt
          count: 100000
          threads: 4
          duration: 30
          port: 5353
          queries-file: /tmp/queries.txt
      - name: Stop server
        run: kill $(cat /tmp/server.pid) 2>/dev/null || echo "server had already exited"
      - name: Generate report
        run: |
          python3 scripts/xdp_stress_report.py --single /tmp/e2e-result.txt > /tmp/e2e-report.md \
            || echo "E2E report generation skipped (dnsperf produced no parseable output)" > /tmp/e2e-report.md
      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Userspace Performance (report-only)"
            echo "E2E measured with \`RUST_LOG=warn\` (per-query info logs suppressed); component benches are base-vs-PR on this same runner."
            cat /tmp/e2e-report.md 2>/dev/null || echo "no e2e report"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo '### Component benchmarks: base (main)'
              echo '```'
              cat /tmp/bench-base.txt 2>/dev/null || echo "benchmarks did not run"
              echo '```'
              echo '### Component benchmarks: PR (change lines compare against base)'
              echo '```'
              cat /tmp/bench-pr.txt 2>/dev/null || echo "benchmarks did not run"
              echo '```'
            else
              echo '### Component benchmarks (main)'
              echo '```'
              cat /tmp/bench-main.txt 2>/dev/null || echo "benchmarks did not run"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/e2e-server.log ]; then
            {
              echo '### Server log (end-to-end arm)'
              echo '```'
              tail -n 50 /tmp/e2e-server.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      # Assembles the body the old inline template built. Both files can
      # legitimately be absent: an earlier step may have produced nothing, and
      # this is a report-only job. Reading them unguarded would turn a missing
      # artefact into a red check.
      - name: Assemble PR comment body
        if: |
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          {
            if [ -f /tmp/e2e-report.md ]; then
              cat /tmp/e2e-report.md
            else
              printf '_/tmp/e2e-report.md was not produced by this run_\n'
            fi
            printf '\n## Component Benchmarks (PR vs main)\n\n```\n'
            if [ -f /tmp/bench-pr.txt ]; then
              cat /tmp/bench-pr.txt
            else
              printf '_/tmp/bench-pr.txt was not produced by this run_\n'
            fi
            printf '\n```\n'
          } > /tmp/comment-body.md
      # A push to main has no issue/PR to comment on, and fork PRs get a
      # read-only token, so only same-repo PRs can be commented on.
      - name: Post PR comment
        if: |
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/pr-comment
        with:
          body-file: /tmp/comment-body.md
